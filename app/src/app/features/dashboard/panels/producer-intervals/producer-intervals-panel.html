<app-panel class="h-100" title="Producers with longest and shortest interval between wins">
  @if (intervals.isLoading()) {
    <app-loading-indicator />
  } @else if (intervals.error()) {
    <app-error-state [message]="errorMessage()" (retry)="intervals.reload()" />
  } @else {
    <section aria-labelledby="producer-intervals-max">
      <h3 id="producer-intervals-max" class="fs-5 fw-normal mb-2">Maximum</h3>
      <app-data-table
        [columns]="columns"
        [rows]="intervals.value().max"
        [trackBy]="byProducerAndPreviousWin"
        emptyMessage="No producer has won more than once"
      />
    </section>

    <section class="mt-3" aria-labelledby="producer-intervals-min">
      <h3 id="producer-intervals-min" class="fs-5 fw-normal mb-2">Minimum</h3>
      <app-data-table
        [columns]="columns"
        [rows]="intervals.value().min"
        [trackBy]="byProducerAndPreviousWin"
        emptyMessage="No producer has won more than once"
      />
    </section>
  }
</app-panel>
